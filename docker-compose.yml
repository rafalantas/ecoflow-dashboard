services:
  ecoflow-dashboard:
    image: ghcr.io/rafalantas/ecoflow-dashboard:latest
    pull_policy: always
    container_name: ecoflow-dashboard
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Warsaw
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
      - DEVICE_SN=${DEVICE_SN}
      - DEVICE_SN2=${DEVICE_SN2}
      - EF_ACCESS_KEY=${EF_ACCESS_KEY}
      - EF_SECRET_KEY=${EF_SECRET_KEY}
      - EF_EMAIL=${EF_EMAIL}
      - EF_PASSWORD=${EF_PASSWORD}
      - EF_SPACE_ID=${EF_SPACE_ID}
      - METER_SN=${METER_SN}
      - PSTRYK_API_KEY=${PSTRYK_API_KEY}
      - SOLCAST_API_KEY=${SOLCAST_API_KEY}
      - SOLCAST_RESOURCE_ID=${SOLCAST_RESOURCE_ID}
      - EF_USER_ID=${EF_USER_ID}
      - EF_MQTT_INSECURE=${EF_MQTT_INSECURE:-}
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    pull_policy: always
    container_name: ecoflow-dashboard-cloudflared
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - ecoflow-dashboard
